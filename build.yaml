# GitHub Actions build matrix.
# The Gran Roque targets preserve the original large-display shield and custom widgets.
# Only the small-display Roque targets use Infely's nice!view battery screen.
---
include:
  - board: nice_nano_v2
    shield: roque_left granroque
    snippet: studio-rpc-usb-uart
    artifact-name: Gran-Roque-left

  - board: nice_nano_v2
    shield: roque_right granroque
    artifact-name: Gran-Roque-right

  - board: nice_nano_v2
    shield: roque_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DEXTRA_CONF_FILE=../../config/roque-nice_view.conf
    artifact-name: Roque-left

  - board: nice_nano_v2
    shield: roque_right nice_view
    cmake-args: -DEXTRA_CONF_FILE=../../config/roque-nice_view.conf
    artifact-name: Roque-right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings-reset